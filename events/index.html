<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --background: #f4eee8;
      --card: rgba(255, 255, 255, 0.88);
      --text: #2f2926;
      --muted: #6f625b;
      --accent: #7b2636;
      --accent-hover: #641d2b;
      --line: rgba(123, 38, 54, 0.14);
      --success-bg: #f1e5e5;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 34%),
        linear-gradient(145deg, #eee5de 0%, var(--background) 52%, #e8ddd5 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .card {
      width: min(100%, 720px);
      padding: clamp(34px, 7vw, 68px);
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(67, 45, 36, .13);
      backdrop-filter: blur(10px);
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--success-bg);
      color: var(--accent);
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.04;
      letter-spacing: -0.035em;
    }

    .lead {
      max-width: 550px;
      margin: 24px auto 0;
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1.55;
    }

    .note {
      display: inline-block;
      margin-top: 16px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent);
      font-weight: 700;
      background: rgba(255,255,255,.55);
    }

    .divider {
      width: 72px;
      height: 1px;
      margin: 34px auto;
      background: var(--line);
    }

    .telegram-text {
      max-width: 520px;
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 34px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .035em;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(123,38,54,.23);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: var(--accent-hover);
      box-shadow: 0 16px 34px rgba(123,38,54,.28);
    }

    .button:focus-visible {
      outline: 3px solid rgba(123,38,54,.25);
      outline-offset: 4px;
    }

    .footer {
      margin-top: 28px;
      color: #91837b;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      body {
        padding: 18px 12px;
      }

      .card {
        border-radius: 22px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✓</div>

    <h1>Оплата успішна</h1>

    <p class="lead">
      На Ваш мейл надіслано лінк з доступом до курсу.
    </p>

    <div class="note">Також перевірте папку «Спам»</div>

    <div class="divider" aria-hidden="true"></div>

    <p class="telegram-text">
      Приєднуйтесь до Telegram школи, щоб бути з нами на зв’язку
      й отримувати приємні бонуси.
    </p>

    <a
      class="button"
      href="https://telegram.me/Hejka_polskibot"
      target="_blank"
      rel="noopener noreferrer"
    >
      ПЕРЕЙТИ В TELEGRAM
    </a>

    <p class="footer">Дякуємо, що навчаєтесь разом із нами ❤️</p>
  </main>
</body>
</html>
